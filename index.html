<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ruuvi Temperature Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2em; background: #f6f8fa; }
    canvas { max-width: 800px; margin: 0 auto; }
    #updated { margin-top: 1em; color: #555; }
  </style>
</head>
<body>
  <h1>Ruuvi Temperature (Past 24h)</h1>
  <canvas id="tempChart" width="800" height="400"></canvas>
  <div id="updated">Last updated: never</div>
  <script>
    // Replace with your actual token and sensor MAC
    const ACCESS_TOKEN = 'your-access-token-here';
    const SENSOR_MAC = 'FD:48:9A:5B:C7:B9'; // Uppercase, colon-separated
    const chartCtx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(chartCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Temperature (°C)',
          data: [],
          borderColor: 'rgba(255, 99, 132, 1)',
          fill: false,
          tension: 0.1
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'time',
            time: { unit: 'hour', tooltipFormat: 'MMM d, HH:mm' },
            title: { display: true, text: 'Time' }
          },
          y: {
            title: { display: true, text: '°C' }
          }
        }
      }
    });
    async function fetchTemperatureHistory() {
      const now = Math.floor(Date.now() / 1000);
      const yesterday = now - 24 * 3600;
      const url = `https://network.ruuvi.com/history?sensor=${encodeURIComponent(SENSOR_MAC)}&start=${yesterday}&end=${now}`;
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${ACCESS_TOKEN}`
        }
      });
      if (!res.ok) {
        console.error('Fetch error:', res.status);
        return;
      }
      const json = await res.json();
      const measurements = json?.data?.measurements ?? [];
      const offset = json?.data?.offsetTemperature ?? 0;
      const labels = [];
      const temps = [];
      for (const m of measurements) {
        const hex = m.data;
        const bytes = hexToBytes(hex);
        const ff = bytes.indexOf(0xFF);
        if (ff === -1 || bytes[ff+1] !== 0x99 || bytes[ff+2] !== 0x04 || bytes[ff+3] !== 0x05) continue;
        const tempRaw = (bytes[ff+4] << 8) | bytes[ff+5];
        const tempSigned = (tempRaw << 16) >> 16;
        const temp = tempSigned * 0.005 + offset;
        const time = new Date(m.timestamp * 1000);
        labels.push(time);
        temps.push(temp);
      }
      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = temps;
      tempChart.update();
      document.getElementById('updated').textContent =
        'Last updated: ' + new Date().toLocaleTimeString();
    }
    function hexToBytes(hex) {
      const bytes = [];
      for (let i = 0; i < hex.length; i += 2) {
        bytes.push(parseInt(hex.slice(i, i + 2), 16));
      }
      return bytes;
    }
    fetchTemperatureHistory();
    setInterval(fetchTemperatureHistory, 60 * 1000); // refresh every 60 seconds
  </script>
</body>
</html>
