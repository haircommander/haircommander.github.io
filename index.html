<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Ruuvi Temperature Chart</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
	<style>
		body { font-family: sans-serif; text-align: center; padding: 2em; background: #f6f8fa; }
		canvas { max-width: 800px; margin: 0 auto; }
		#updated { margin-top: 1em; color: #555; }
	</style>
</head>
<body>
<h1>Sauna Temperature</h1>
<canvas id="tempChart" width="800" height="400"></canvas>
<div id="updated">Last updated: never</div>
<script>
    const chartCtx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(chartCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'stove (°F)',
                data: [],
                borderColor: 'rgba(255, 99, 132, 1)',
                fill: false,
                tension: 0.1
    }, {
                label: 'hot room (°F)',
                data: [],
                borderColor: 'rgba(255, 99, 132, 1)',
                fill: false,
                tension: 0.1
    }]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    type: 'time',
                    time: { unit: 'hour', tooltipFormat: 'MMM d, HH:mm' },
                    title: { display: true, text: 'Time' }
                },
                y: {
                    title: { display: true, text: '°F' }
                }
            }
        }
    });

    async function fetchTemperatureHistory() {
		let labels = [];
		let stoveData = [];
		let hotRoomData = [];

        const url = `https://qwfw4qlnfarha3mihn6kxu37zq0cjzck.lambda-url.us-east-2.on.aws/`;
        const res = await fetch(url);
        if (!res.ok) {
            console.error('Fetch error:', res.status);
            return;
        }
        const json = await res.json();
		console.log(json.body.channels);
        for (const obj of json?.body?.channels) {
			labels.push(obj.last_seen);
			let idx = String(obj.label).includes("stove") ? 0 : 1;
			tempChart.data.datasets[idx].data.push(temp(obj));
			console.log(idx + " " + temp(obj));
        }
        tempChart.data.labels = labels;
        tempChart.update();
		console.log(tempChart.data);
		document.getElementById('updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    }

	function temp(obj) {
		if (obj?.units == "C") {
			return (obj.value * 9 / 5) + 32;
		}
		return obj.value;
	}

    fetchTemperatureHistory();
    setInterval(fetchTemperatureHistory, 60 * 1000); // refresh every 60 seconds
</script>
</body>
</html>
